# Verify-kedjan (F0-09): lint + typkontroll + prov vid varje push och pull request.
# Förlaga: pe-portal/.github/workflows/verify.yml. PostgreSQL körs som tjänst så att databasproven
# alltid körs här (--require-pg) — i CI får de aldrig hoppas över.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:test@localhost:5432/test
      # Fillagringen i Azure provas mot Microsofts emulator Azurite (F1-01). Nyckeln är emulatorns publicerade
      # standardnyckel, ingen hemlighet. Startas som ett steg: en tjänst kan inte ta startargument, och utan
      # --blobHost 0.0.0.0 lyssnar emulatorn bara inne i sin container.
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      REQUIRE_AZURITE: '1'
    steps:
      - name: Starta Azurite
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.33.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0; sleep 1; done
          docker logs azurite; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/verify.py --require-pg --coverage
      # Kända sårbarheter i beroendena: rapport, fäller inte bygget — läs utfallet vid varje släpp.
      - name: Sarbarheter i beroendena
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # Automatisk utläggning i dev (F0-20): när grenen dev har gröna prov. Servern lägger bara ut exakt den
  # provade commiten (github.sha). Hoppas över tills variabeln DEV_HOST finns (driftsattning.md steg 5).
  deploy-dev:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEV_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Las in deploy-nyckeln
        env:
          KEY: ${{ secrets.DEV_DEPLOY_KEY }}
          HOST: ${{ vars.DEV_HOST }}
          HOST_KEY: ${{ vars.DEV_HOST_KEY }}
        run: bash deploy/ci_write_key.sh
      - name: Lagg ut i dev
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes pdfdeploy@"${{ vars.DEV_HOST }}" "deploy ${{ github.sha }}"
