# Verify-kedjan (F0-09): lint + typkontroll + prov vid varje push och pull request.
# Förlaga: pe-portal/.github/workflows/verify.yml. PostgreSQL körs som tjänst så att databasproven
# alltid körs här (--require-pg) — i CI får de aldrig hoppas över.
# Jobbet deploy-dev läggs till i F0-20, när dev-miljön i Azure finns.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/verify.py --require-pg --coverage
      # Kända sårbarheter i beroendena: rapport, fäller inte bygget — läs utfallet vid varje släpp.
      - name: Sarbarheter i beroendena
        run: pip-audit -r requirements.txt
        continue-on-error: true
