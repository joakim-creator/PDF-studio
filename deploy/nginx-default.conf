# PDF-studio — Nginx, okända värdnamn (F0-10). Bara på en server där PDF-studio är ensam (produktionen, B-010):
# installeras till /etc/nginx/sites-available/default. På pe-portal-dev har PE Portal redan ett sådant block.

# Anrop direkt mot IP-adressen eller med ett okänt värdnamn stängs utan svar.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
