# PDF-studio — Nginx (F0-10, F0-20). Installeras till /etc/nginx/sites-available/pdf-studio; byt DOMÄN mot
# dev- eller produktionsdomänen. certbot --nginx lägger själv till 443-blocket och omdirigeringen från 80.
# Blocket för okända värdnamn ligger i nginx-default.conf och installeras bara på en egen server: på dev-servern
# har PE Portal redan ett default_server, och två ger fel i `nginx -t` (B-010).

server {
    listen 80;
    listen [::]:80;
    server_name DOMÄN;

    # Samma gräns som appen (MAX_CONTENT_LENGTH, 32 MB).
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8010;   # PE Portal har 8000 på dev-servern
        proxy_set_header Host $host;
        # Appen litar på exakt en proxy (ProxyFix x_for=1, x_proto=1): den här.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ärendenumret: samma nummer i Nginx-loggen, appens logg, felsidan och felrapporten.
        proxy_set_header X-Request-ID $request_id;
    }
}
