# PDF-studio — Nginx (F0-10, F0-20). Installeras till /etc/nginx/sites-available/pdf-studio; byt DOMÄN mot
# dev- eller produktionsdomänen. certbot --nginx lägger själv till 443-blocket och omdirigeringen från 80.

# Okända värdnamn (t.ex. anrop direkt mot IP-adressen) stängs utan svar.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMÄN;

    # Samma gräns som appen (MAX_CONTENT_LENGTH, 32 MB).
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Appen litar på exakt en proxy (ProxyFix x_for=1, x_proto=1): den här.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ärendenumret: samma nummer i Nginx-loggen, appens logg, felsidan och felrapporten.
        proxy_set_header X-Request-ID $request_id;
    }
}
