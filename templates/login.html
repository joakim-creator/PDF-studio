{% extends 'base.html' %}
{% block title %}Logga in – PDF-studio{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<section class="card auth-card" aria-labelledby="login-title">
  <h1 id="login-title">Logga in</h1>
  {% if entra %}
  <a class="btn btn-primary btn-block" href="{{ url_for('auth.microsoft_login', next=request.args.get('next')) }}">Logga in med Microsoft</a>
  <p class="divider"><span>eller med reservkonto</span></p>
  {% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="tenant">Bolag</label>
    <input id="tenant" name="tenant" autocomplete="organization" required>
    <label for="username">Användarnamn</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Lösenord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary btn-block">Fortsätt</button>
  </form>
</section>
{% endblock %}
